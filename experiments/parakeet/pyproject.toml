[project]
name = "lecture-parakeet-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "nemo_toolkit[asr]==3.0.0", "torch==2.9.1", "torchaudio==2.9.1",
  "transformers==4.57.1", "numpy>=2,<3", "numba-cuda[cu12]", "cuda-python>=12,<13",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
