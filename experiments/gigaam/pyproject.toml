[project]
name = "lecture-gigaam-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.9.1", "torchaudio==2.9.1", "transformers==4.57.1",
  "hydra-core==1.3.2", "omegaconf==2.3.0", "sentencepiece", "numpy>=2,<3",
  "pyannote-core>=6,<7",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
