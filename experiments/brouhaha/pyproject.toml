[project]
name = "lecture-brouhaha-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.5.1", "torchaudio==2.5.1", "numpy>=1.26,<2",
  "pyannote.audio>=3.1,<3.3.1", "speechbrain>=0.5.14,<1",
  "soundfile", "lightning>=2.2,<2.6", "huggingface-hub<1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
