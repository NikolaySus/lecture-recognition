[project]
name = "lecture-recognition"
version = "0.2.0"
description = "Local equal-channel lecture transcription MCP and Codex reconciliation skill"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.9.1",
  "transformers",
  "numpy>=2,<3",
  "soundfile>=0.13",
  "librosa>=0.11",
  "accelerate>=1.10",
  "tqdm>=4.67",
  "mcp>=1.12,<2",
  "filelock>=3.16",
  "psutil>=7",
]

[project.scripts]
lecture-transcription-mcp = "lecture_recognition.mcp_server:main"
lecture-recognition = "lecture_recognition.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/lecture_recognition", "pyproject.toml", "uv.lock", "README.md", "LICENSE", "experiments/gigaam/pyproject.toml", "experiments/gigaam/uv.lock"]

[tool.hatch.build.targets.sdist.force-include]
"src/lecture_recognition/skills/lecture-transcription/SKILL.md" = "src/lecture_recognition/skills/lecture-transcription/SKILL.md"

[tool.hatch.build.targets.wheel]
packages = ["src/lecture_recognition"]

[tool.hatch.build.targets.wheel.force-include]
"src/lecture_recognition/skills/lecture-transcription/SKILL.md" = "lecture_recognition/skills/lecture-transcription/SKILL.md"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
transformers = { git = "https://github.com/huggingface/transformers", rev = "5e4d6304de5536bc808187e5951f5e8794211229" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
